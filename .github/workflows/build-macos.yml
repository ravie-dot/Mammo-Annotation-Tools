name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install opencv-python
        pip install numpy
        pip install PyQt5
    
    - name: Build with PyInstaller
      run: |
        pyinstaller --onedir \
                    --windowed \
                    --name "MammoAnnotation" \
                    --add-data "mammo_paths.py:." \
                    --hidden-import PyQt5 \
                    --hidden-import cv2 \
                    --hidden-import numpy \
                    app.py
    
    - name: Create .app bundle
      run: |
        # Ensure the app structure is correct
        if [ -d "dist/MammoAnnotation" ]; then
          echo "✅ Build successful"
          ls -la dist/
        else
          echo "❌ Build failed"
          exit 1
        fi
    
    - name: Upload .app artifact
      uses: actions/upload-artifact@v4
      with:
        name: MammoAnnotation-macOS
        path: dist/MammoAnnotation
        retention-days: 30
